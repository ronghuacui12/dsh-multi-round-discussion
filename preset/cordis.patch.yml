# ── 多模型研讨 preset（mmd-discussion）──────────────────────────────────────
# 工具行放在 host 平面：执行模型按当前作用域枚举工具，host 平面注册的
# read/write/edit/glob/grep/pwsh 对引擎可见，而 preset 只需提供 persona 与技能。
# 插件本身（客户端 UI / HTTP 接口 / 设置页）也留在 host 平面，否则客户端 bundle
# 不会进 boot graph。
- insert:
    - id: mmd-tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: mmd-tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: mmd-tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: mmd-tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'

- insert:
    - id: preset-mmd-discussion
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mmd-discussion
        name: 研讨模式
        description: 多模型研讨：多个模型并行独立提案 → 互相评议 → 主导模型决策并生成计划 → 计划经你过目同意后，才由执行模型落地。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh', 'mmd', 'persona.md'), 'utf8')"

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh', 'mmd', 'skills')"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

# ── 执行模型完全权限 ────────────────────────────────────────────────────────
# sandboxPolicy 的部署默认模式：没有会话上下文的工具调用（研讨的执行模型在
# 「完全权限」策略下就是这种调用）按它解析。danger-full-access = 不受限。
# 有自己权限预设的会话不受影响 —— 会话里的 sandbox/mode 事件始终优先于默认值。
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

# ── 权限预设（DSH 0.2.1 起必填）──────────────────────────────────────────────
# 0.2.1 的 permission-presets 会校验「沙箱默认值 + 审批默认值」是否命中某个预设，
# 命中不了就拒绝激活（dsh: warning: 1 entry did not activate）。改成
# danger-full-access 的沙箱默认后，审批默认仍是 ask，因此必须显式指定 defaultPreset。
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
